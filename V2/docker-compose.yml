# Expense Tracker v2 — service compose file.
# Traefik itself and the traefik-public network are managed elsewhere on the VPS
# (Helmwill/DevOps-Platform) — this file only defines the expenses service.
services:
  expenses:
    build: .
    image: expenses-v2:latest
    container_name: expenses-v2
    restart: unless-stopped

    # Hardened container settings (match prod/docker-compose.yml conventions)
    read_only: true
    security_opt:
      - no-new-privileges:true
    # Writable paths the container needs at runtime. Root FS is read-only, so
    # anything that writes to disk goes here (or on the named volume below).
    tmpfs:
      - /tmp

    env_file:
      - .env

    # SQLite DB on a named Docker volume (not bind-mounted). Not used until
    # Stage 2, but mounted now so no compose changes are needed later.
    volumes:
      - expenses-data:/data

    healthcheck:
      # python:slim has no curl/wget; use the interpreter that's already present.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - traefik-public

    labels:
      - "traefik.enable=true"

      # Router: HTTPS host rule + Let's Encrypt TLS via Traefik.
      - "traefik.http.routers.expenses.rule=Host(`expenses.helmcommand.website`)"
      - "traefik.http.routers.expenses.entrypoints=websecure"
      - "traefik.http.routers.expenses.tls=true"
      - "traefik.http.routers.expenses.tls.certresolver=letsencrypt"  

      # Basic-auth middleware, same pattern as dashboard.helmcommand.website.
      # NOTE: `expenses-auth` is a placeholder name — confirm it matches the
      # basic-auth middleware convention in the human's actual Traefik setup.
      # Credentials come from .env (EXPENSES_AUTH), never inline.
      - "traefik.http.routers.expenses.middlewares=expenses-auth"
      - "traefik.http.middlewares.expenses-auth.basicauth.users=${EXPENSES_AUTH}"

      # Tell Traefik which container port to route to.
      - "traefik.http.services.expenses.loadbalancer.server.port=8000"

networks:
  traefik-public:
    external: true

volumes:
  expenses-data:
